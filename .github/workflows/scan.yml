name: Ferry Availability Scanner

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ferry_scanner.py

      - name: Commit updated state file
        run: |
          git config user.name "ferry-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_known_state.txt || true
          git commit -m "Update scan state [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"
